name: CI

on:
  push:
    branches:
      - '**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # Repository tests run against a real database; they skip when DB_URL is unset
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: questmaster
          POSTGRES_PASSWORD: questmaster
          POSTGRES_DB: questmaster
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U questmaster"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: postgres://questmaster:questmaster@localhost:5432/questmaster?sslmode=disable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Applies every migration, rolls them all back, then applies them again,
      # so broken down migrations fail the build too
      - name: Apply migrations
        run: |
          up() { for f in $(ls migrations/*.up.sql | sort); do psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "$f"; done; }
          down() { for f in $(ls migrations/*.down.sql | sort -r); do psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "$f"; done; }
          up
          down
          up

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Builds the image without publishing it, to catch Dockerfile breakage before a release tag
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  swagger:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # swag is declared as a tool in go.mod, so its version is pinned there
      - name: Generate Swagger docs
        run: go tool swag init -g cmd/app/main.go --parseInternal

      # Commits made with GITHUB_TOKEN don't trigger new workflow runs, so this can't loop
      - name: Commit updated docs
        run: |
          if git diff --quiet -- docs/; then
            echo "Swagger docs are up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "Regenerate Swagger docs"
          git push

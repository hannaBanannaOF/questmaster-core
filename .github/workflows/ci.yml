name: CI

on:
  push:
    branches:
      - '**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  swagger:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Uses the swag version pinned in go.mod
      - name: Generate Swagger docs
        run: go run github.com/swaggo/swag/cmd/swag init -g cmd/app/main.go --parseInternal

      # Commits made with GITHUB_TOKEN don't trigger new workflow runs, so this can't loop
      - name: Commit updated docs
        run: |
          if git diff --quiet -- docs/; then
            echo "Swagger docs are up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "Regenerate Swagger docs"
          git push

definitions:
  campaign.CampaignCharacterRefResponse:
    properties:
      name:
        type: string
      slug:
        type: string
    type: object
  campaign.CampaignDetailResponse:
    properties:
      characters:
        items:
          $ref: '#/definitions/campaign.CampaignDetailResponseCharacterItem'
        type: array
      id:
        type: integer
      invite_hash:
        type: string
      is_dm:
        type: boolean
      name:
        type: string
      overview:
        type: string
      slug:
        type: string
      status:
        type: string
      system:
        type: string
    type: object
  campaign.CampaignDetailResponseCharacterItem:
    properties:
      current_hp:
        type: integer
      id:
        type: integer
      name:
        type: string
    type: object
  campaign.CampaignListPageResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/campaign.CampaignListResponse'
        type: array
      total:
        type: integer
    type: object
  campaign.CampaignListResponse:
    properties:
      is_dm:
        type: boolean
      my_characters:
        description: The requester characters in the campaign, ordered by name; empty
          when the requester only runs it
        items:
          $ref: '#/definitions/campaign.CampaignCharacterRefResponse'
        type: array
      name:
        type: string
      player_count:
        type: integer
      slug:
        type: string
      status:
        type: string
      system:
        type: string
    type: object
  campaign.CampaignStatusCountsResponse:
    properties:
      ACTIVE:
        type: integer
      ARCHIVED:
        type: integer
      DRAFT:
        type: integer
      PAUSED:
        type: integer
    type: object
  campaign.CampaignStatusResponse:
    properties:
      status:
        type: string
    type: object
  campaign.CreateCampaignRequest:
    properties:
      name:
        type: string
      overview:
        type: string
      system:
        type: string
    type: object
  campaign.UpdateCampaignStatusRequest:
    properties:
      status:
        type: string
    type: object
  character.CharacterCurrentHpResponse:
    properties:
      current_hp:
        type: integer
    type: object
  character.CharacterDetailResponse:
    properties:
      current_hp:
        type: integer
      id:
        type: integer
      is_player:
        type: boolean
      max_hp:
        type: integer
      name:
        type: string
      slug:
        type: string
      system:
        type: string
    type: object
  character.CharacterListPageResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/character.CharacterListResponse'
        type: array
      total:
        type: integer
    type: object
  character.CharacterListResponse:
    properties:
      current_hp:
        type: integer
      max_hp:
        type: integer
      name:
        type: string
      slug:
        type: string
      system:
        type: string
    type: object
  character.CreateCharacterRequest:
    properties:
      hp:
        type: integer
      name:
        type: string
      system:
        type: string
    type: object
  character.UpdateHPRequest:
    properties:
      new_hp:
        type: integer
    type: object
  httperrors.HttpError:
    properties:
      message:
        type: string
      status:
        type: integer
    type: object
  invite.AcceptInviteRequest:
    properties:
      character_slug:
        type: string
    type: object
  invite.CreateInviteRequest:
    properties:
      campaign_id:
        type: integer
    type: object
  invite.InviteCreateResponse:
    properties:
      hash:
        type: string
    type: object
  invite.InviteDetailsResponse:
    properties:
      campaign_name:
        type: string
      campaign_overview:
        type: string
      campaign_player_count:
        type: integer
      campaign_slug:
        type: string
      campaign_system:
        type: string
      invite_hash:
        type: string
      is_dm:
        type: boolean
    type: object
  rpg.RpgIdResponse:
    properties:
      id:
        type: integer
    type: object
  rpg.RpgSlugResponse:
    properties:
      slug:
        type: string
    type: object
  user.UserResponse:
    properties:
      id:
        type: string
      name:
        type: string
      surname:
        type: string
      username:
        type: string
    type: object
info:
  contact: {}
  description: REST APIs of Questmaster for documentation.
  title: Questmaster's APIs
  version: "1.0"
paths:
  /core/api/v1/campaign:
    get:
      description: Get a page of the current user campaigns as **player** and **DM**,
        ordered by name (ignoring case and accents), then id
      parameters:
      - description: Only campaigns where the user has this role
        enum:
        - dm
        - player
        in: query
        name: role
        type: string
      - description: Only campaigns with this status
        enum:
        - DRAFT
        - ACTIVE
        - PAUSED
        - ARCHIVED
        in: query
        name: status
        type: string
      - default: 50
        description: Page size, 1 to 100
        in: query
        name: limit
        type: integer
      - default: 0
        description: Number of campaigns to skip
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/campaign.CampaignListPageResponse'
        "400":
          description: Invalid role, status, limit or offset
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "401":
          description: Unauthorized - missing or invalid access_token
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httperrors.HttpError'
      security:
      - BearerAuth: []
      summary: Get current user campaigns
      tags:
      - v1:campaign
    post:
      consumes:
      - application/json
      description: Create new campaign with status **DRAFT**
      parameters:
      - description: Campaign data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/campaign.CreateCampaignRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/rpg.RpgSlugResponse'
        "400":
          description: Invalid campaign data
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "401":
          description: Unauthorized - missing or invalid access_token
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httperrors.HttpError'
      security:
      - BearerAuth: []
      summary: Create campaign
      tags:
      - v1:campaign
  /core/api/v1/campaign/{campaignID}:
    delete:
      description: Deletes a campaign with the status **ARCHIVED** or **DRAFT**
      parameters:
      - description: Campaign ID
        in: path
        name: campaignID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized - missing or invalid access_token
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "403":
          description: Only the DM can delete a campaign
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "404":
          description: Campaign not found
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httperrors.HttpError'
      security:
      - BearerAuth: []
      summary: Delete campaign
      tags:
      - v1:campaign
    get:
      description: Get a more detailed view of the campaign. Only the DM and players
        with a character in the campaign can see it, and only the DM gets the invite
        hash
      parameters:
      - description: Campaign ID
        in: path
        name: campaignID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/campaign.CampaignDetailResponse'
        "401":
          description: Unauthorized - missing or invalid access_token
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "403":
          description: Not a member of this campaign
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "404":
          description: Campaign not found
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httperrors.HttpError'
      security:
      - BearerAuth: []
      summary: Get campaign details
      tags:
      - v1:campaign
  /core/api/v1/campaign/{campaignID}/status:
    patch:
      consumes:
      - application/json
      description: |-
        Updates campaign status to the following rules:
        - **DRAFT** -> ACTIVE
        - **ACTIVE** -> PAUSED / ARCHIVED
        - **PAUSED** -> ACTIVE / ARCHIVED
      parameters:
      - description: Campaign ID
        in: path
        name: campaignID
        required: true
        type: integer
      - description: New campaign status
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/campaign.UpdateCampaignStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/campaign.CampaignStatusResponse'
        "401":
          description: Unauthorized - missing or invalid access_token
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "403":
          description: Only the DM can update a campaign, or the status transition
            is invalid
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "404":
          description: Campaign not found
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httperrors.HttpError'
      security:
      - BearerAuth: []
      summary: Update Status
      tags:
      - v1:campaign
  /core/api/v1/campaign/counts:
    get:
      description: Number of the current user campaigns in each status. Every status
        is present, with 0 when there is none
      parameters:
      - description: Only campaigns where the user has this role
        enum:
        - dm
        - player
        in: query
        name: role
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/campaign.CampaignStatusCountsResponse'
        "400":
          description: Invalid role
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "401":
          description: Unauthorized - missing or invalid access_token
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httperrors.HttpError'
      security:
      - BearerAuth: []
      summary: Get current user campaign counts by status
      tags:
      - v1:campaign
  /core/api/v1/campaign/resolve/{slug}:
    get:
      description: Resolves the campaign slug to the internal ID
      parameters:
      - description: Campaign slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rpg.RpgIdResponse'
        "400":
          description: Invalid slug
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "401":
          description: Unauthorized - missing or invalid access_token
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "404":
          description: Campaign not found
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httperrors.HttpError'
      security:
      - BearerAuth: []
      summary: Resolve campaign slug
      tags:
      - v1:campaign
  /core/api/v1/character:
    get:
      description: Get a page of the current user characters, ordered by name (ignoring
        case and accents), then id
      parameters:
      - description: Only characters of this game system
        in: query
        name: game_system
        type: string
      - description: 'true: only characters without a campaign; false: only characters
          in a campaign'
        in: query
        name: without_campaign
        type: boolean
      - default: 50
        description: Page size, 1 to 100
        in: query
        name: limit
        type: integer
      - default: 0
        description: Number of characters to skip
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/character.CharacterListPageResponse'
        "400":
          description: Invalid game_system, limit or offset
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "401":
          description: Unauthorized - missing or invalid access_token
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httperrors.HttpError'
      security:
      - BearerAuth: []
      summary: Get current user characters
      tags:
      - v1:character
    post:
      consumes:
      - application/json
      description: Create new character
      parameters:
      - description: Character data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/character.CreateCharacterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/rpg.RpgSlugResponse'
        "400":
          description: Invalid character data
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "401":
          description: Unauthorized - missing or invalid access_token
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httperrors.HttpError'
      security:
      - BearerAuth: []
      summary: Create character
      tags:
      - v1:character
  /core/api/v1/character/{characterID}:
    delete:
      description: Deletes a character
      parameters:
      - description: Character ID
        in: path
        name: characterID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized - missing or invalid access_token
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "403":
          description: Only the player can delete a character
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "404":
          description: Character not found
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httperrors.HttpError'
      security:
      - BearerAuth: []
      summary: Delete character
      tags:
      - v1:character
    get:
      description: Get a more detailed view of the character
      parameters:
      - description: Character ID
        in: path
        name: characterID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/character.CharacterDetailResponse'
        "401":
          description: Unauthorized - missing or invalid access_token
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "404":
          description: Character not found
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httperrors.HttpError'
      security:
      - BearerAuth: []
      summary: Get character details
      tags:
      - v1:character
  /core/api/v1/character/{characterID}/hp:
    patch:
      consumes:
      - application/json
      description: Updates character HP
      parameters:
      - description: Character ID
        in: path
        name: characterID
        required: true
        type: integer
      - description: New character HP
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/character.UpdateHPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/character.CharacterCurrentHpResponse'
        "401":
          description: Unauthorized - missing or invalid access_token
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "403":
          description: Only the character's player can update it
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "404":
          description: Character not found
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httperrors.HttpError'
      security:
      - BearerAuth: []
      summary: Update HP
      tags:
      - v1:character
  /core/api/v1/character/resolve/{slug}:
    get:
      description: Resolves the character slug to the internal ID
      parameters:
      - description: Character slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rpg.RpgIdResponse'
        "400":
          description: Invalid slug
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "401":
          description: Unauthorized - missing or invalid access_token
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "404":
          description: Character not found
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httperrors.HttpError'
      security:
      - BearerAuth: []
      summary: Resolve character slug
      tags:
      - v1:character
  /core/api/v1/invite:
    post:
      consumes:
      - application/json
      description: Create a new campaign invite
      parameters:
      - description: Invite data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/invite.CreateInviteRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/invite.InviteCreateResponse'
        "400":
          description: Campaign is archived
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "401":
          description: Unauthorized - missing or invalid access_token
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "403":
          description: Only the DM can create a campaign invite
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "404":
          description: Campaign not found
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "409":
          description: Invite for campaign already exists
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httperrors.HttpError'
      security:
      - BearerAuth: []
      summary: Create campaign invite
      tags:
      - v1:invite
  /core/api/v1/invite/{inviteHash}:
    get:
      description: Gets the invite's campaign details (name, overview, game system,
        player count) for any user holding the hash. `is_dm` tells whether the requester
        is the campaign DM, who can't accept the invite
      parameters:
      - description: Invite hash
        in: path
        name: inviteHash
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/invite.InviteDetailsResponse'
        "401":
          description: Unauthorized - missing or invalid access_token
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "404":
          description: Invite not found
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httperrors.HttpError'
      security:
      - BearerAuth: []
      summary: Get campaign invite details
      tags:
      - v1:invite
  /core/api/v1/invite/{inviteHash}/accept:
    post:
      consumes:
      - application/json
      description: Accepts campaign invite linking selected character to campaign
      parameters:
      - description: Invite accept data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/invite.AcceptInviteRequest'
      - description: Invite hash
        in: path
        name: inviteHash
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Campaign is archived, or the character is not the requester's,
            is already in a campaign or has another game system
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "401":
          description: Unauthorized - missing or invalid access_token
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "403":
          description: The DM can't join their own campaign
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "404":
          description: Invite not found
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httperrors.HttpError'
      security:
      - BearerAuth: []
      summary: Accept invite
      tags:
      - v1:invite
  /core/api/v1/user:
    get:
      description: Get current user profile
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.UserResponse'
        "401":
          description: Unauthorized - missing or invalid access_token
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httperrors.HttpError'
      security:
      - BearerAuth: []
      summary: Get current user profile
      tags:
      - v1:user
  /health:
    get:
      description: Check application health status
      responses:
        "200":
          description: OK
      summary: Health check
      tags:
      - health
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"

definitions:
  campaign.CampaignCharacterRefResponse:
    properties:
      name:
        type: string
      slug:
        type: string
    type: object
  campaign.CampaignDetailResponse:
    properties:
      characters:
        items:
          $ref: '#/definitions/campaign.CampaignDetailResponseCharacterItem'
        type: array
      dm_name:
        description: How the DM is called in this campaign
        type: string
      id:
        type: integer
      invite_hash:
        type: string
      is_dm:
        type: boolean
      name:
        type: string
      overview:
        type: string
      premade_characters:
        description: Unclaimed premade characters, ordered by name; empty unless the
          requester is the DM
        items:
          $ref: '#/definitions/campaign.CampaignPremadeCharacterResponse'
        type: array
      slug:
        type: string
      status:
        type: string
      system:
        type: string
    type: object
  campaign.CampaignDetailResponseCharacterItem:
    properties:
      id:
        type: integer
      is_mine:
        description: True when the requester is the character player
        type: boolean
      name:
        type: string
      player_name:
        description: How the character's player is called in this campaign
        type: string
      slug:
        type: string
    type: object
  campaign.CampaignListPageResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/campaign.CampaignListResponse'
        type: array
      total:
        type: integer
    type: object
  campaign.CampaignListResponse:
    properties:
      is_dm:
        type: boolean
      last_accessed_at:
        description: The requester last open of the campaign details, null if never
          opened
        type: string
      my_characters:
        description: The requester characters in the campaign, ordered by name; empty
          when the requester only runs it
        items:
          $ref: '#/definitions/campaign.CampaignCharacterRefResponse'
        type: array
      name:
        type: string
      player_count:
        type: integer
      slug:
        type: string
      status:
        type: string
      system:
        type: string
    type: object
  campaign.CampaignPremadeCharacterResponse:
    properties:
      id:
        type: integer
      name:
        type: string
      slug:
        type: string
    type: object
  campaign.CampaignStatusCountsResponse:
    properties:
      ACTIVE:
        type: integer
      ARCHIVED:
        type: integer
      DRAFT:
        type: integer
      PAUSED:
        type: integer
    type: object
  campaign.CampaignStatusResponse:
    properties:
      status:
        type: string
    type: object
  campaign.CreateCampaignRequest:
    properties:
      dm_name:
        description: How the DM is called in this campaign, 1 to 50 characters
        type: string
      name:
        type: string
      overview:
        type: string
      system:
        type: string
    type: object
  campaign.TableNameResponse:
    properties:
      name:
        type: string
    type: object
  campaign.UpdateCampaignStatusRequest:
    properties:
      status:
        type: string
    type: object
  campaign.UpdateTableNameRequest:
    properties:
      name:
        type: string
    type: object
  character.CharacterCampaignResponse:
    properties:
      name:
        type: string
      slug:
        type: string
    type: object
  character.CharacterDetailResponse:
    properties:
      id:
        type: integer
      is_player:
        type: boolean
      name:
        type: string
      slug:
        type: string
      system:
        type: string
    type: object
  character.CharacterEditResponse:
    properties:
      name:
        type: string
      slug:
        type: string
    type: object
  character.CharacterListPageResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/character.CharacterListResponse'
        type: array
      total:
        type: integer
    type: object
  character.CharacterListResponse:
    properties:
      campaign:
        allOf:
        - $ref: '#/definitions/character.CharacterCampaignResponse'
        description: The campaign the character plays in, null when none
      last_accessed_at:
        description: The requester last open of the character details, null if never
          opened
        type: string
      name:
        type: string
      slug:
        type: string
      system:
        type: string
    type: object
  character.CreateCharacterRequest:
    properties:
      name:
        type: string
      system:
        type: string
    type: object
  character.CreatePremadeCharacterRequest:
    properties:
      name:
        type: string
    type: object
  character.EditCharacterRequest:
    properties:
      name:
        type: string
    type: object
  httperrors.HttpError:
    properties:
      message:
        type: string
      status:
        type: integer
    type: object
  invite.AcceptInviteRequest:
    properties:
      character_slug:
        type: string
      player_name:
        description: How the player is called in the campaign, 1 to 50 characters
        type: string
    type: object
  invite.CreateInviteRequest:
    properties:
      campaign_id:
        type: integer
    type: object
  invite.InviteCreateResponse:
    properties:
      hash:
        type: string
    type: object
  invite.InviteDetailsResponse:
    properties:
      campaign_name:
        type: string
      campaign_overview:
        type: string
      campaign_player_count:
        type: integer
      campaign_slug:
        type: string
      campaign_system:
        type: string
      invite_hash:
        type: string
      is_dm:
        type: boolean
      premade_characters:
        description: Unclaimed premade characters the requester may choose when accepting,
          ordered by name
        items:
          $ref: '#/definitions/invite.InvitePremadeCharacterResponse'
        type: array
    type: object
  invite.InvitePremadeCharacterResponse:
    properties:
      name:
        type: string
      slug:
        type: string
    type: object
  rpg.RpgIdResponse:
    properties:
      id:
        type: integer
    type: object
  rpg.RpgSlugResponse:
    properties:
      slug:
        type: string
    type: object
  user.UserResponse:
    properties:
      id:
        type: string
      name:
        type: string
      surname:
        type: string
      username:
        type: string
    type: object
info:
  contact: {}
  description: REST APIs of Questmaster for documentation.
  title: Questmaster's APIs
  version: "1.0"
paths:
  /core/api/v1/campaign:
    get:
      description: 'Get a page of the current user campaigns as **player** and **DM**,
        ordered by `sort` (default: name, ignoring case and accents, then id)'
      parameters:
      - description: Only campaigns where the user has this role
        enum:
        - dm
        - player
        in: query
        name: role
        type: string
      - description: Only campaigns with this status
        enum:
        - DRAFT
        - ACTIVE
        - PAUSED
        - ARCHIVED
        in: query
        name: status
        type: string
      - description: Only campaigns whose name contains it, ignoring case and accents
          (at most 100 characters)
        in: query
        name: q
        type: string
      - description: 'true: only campaigns nobody joined yet'
        in: query
        name: without_players
        type: boolean
      - default: name
        description: 'name: by name; recent: last opened by the user first, never
          opened after, by name'
        enum:
        - name
        - recent
        in: query
        name: sort
        type: string
      - default: 50
        description: Page size, 1 to 100
        in: query
        name: limit
        type: integer
      - default: 0
        description: Number of campaigns to skip
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/campaign.CampaignListPageResponse'
        "400":
          description: Invalid role, status, q, without_players, sort, limit or offset
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "401":
          description: Unauthorized - missing or invalid access_token
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httperrors.HttpError'
      security:
      - BearerAuth: []
      summary: Get current user campaigns
      tags:
      - v1:campaign
    post:
      consumes:
      - application/json
      description: Create new campaign with status **DRAFT**
      parameters:
      - description: Campaign data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/campaign.CreateCampaignRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/rpg.RpgSlugResponse'
        "400":
          description: Invalid campaign data, or dm_name missing or longer than 50
            characters
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "401":
          description: Unauthorized - missing or invalid access_token
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httperrors.HttpError'
      security:
      - BearerAuth: []
      summary: Create campaign
      tags:
      - v1:campaign
  /core/api/v1/campaign/{campaignID}:
    delete:
      description: Deletes a campaign with the status **ARCHIVED** or **DRAFT**
      parameters:
      - description: Campaign ID
        in: path
        name: campaignID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized - missing or invalid access_token
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "403":
          description: Only the DM can delete a campaign
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "404":
          description: Campaign not found
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httperrors.HttpError'
      security:
      - BearerAuth: []
      summary: Delete campaign
      tags:
      - v1:campaign
    get:
      description: Get a more detailed view of the campaign. Only the DM and players
        with a character in the campaign can see it, and only the DM gets the invite
        hash
      parameters:
      - description: Campaign ID
        in: path
        name: campaignID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/campaign.CampaignDetailResponse'
        "401":
          description: Unauthorized - missing or invalid access_token
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "403":
          description: Not a member of this campaign
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "404":
          description: Campaign not found
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httperrors.HttpError'
      security:
      - BearerAuth: []
      summary: Get campaign details
      tags:
      - v1:campaign
  /core/api/v1/campaign/{campaignID}/character:
    post:
      consumes:
      - application/json
      description: The campaign DM prepares a character in the campaign, with no player,
        for players to claim when accepting the invite. It gets the campaign game
        system
      parameters:
      - description: Campaign ID
        in: path
        name: campaignID
        required: true
        type: integer
      - description: Premade character data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/character.CreatePremadeCharacterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/rpg.RpgSlugResponse'
        "400":
          description: Invalid character data, or the campaign is archived
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "401":
          description: Unauthorized - missing or invalid access_token
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "403":
          description: Only the campaign DM can create premade characters
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "404":
          description: Campaign not found
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httperrors.HttpError'
      security:
      - BearerAuth: []
      summary: Create premade character
      tags:
      - v1:character
  /core/api/v1/campaign/{campaignID}/character/{characterID}:
    delete:
      description: The character player leaves the campaign, or the campaign DM removes
        the character. The character keeps its player, with no campaign
      parameters:
      - description: Campaign ID
        in: path
        name: campaignID
        required: true
        type: integer
      - description: Character ID
        in: path
        name: characterID
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Character not in this campaign, unclaimed premade character,
            or archived campaign
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "401":
          description: Unauthorized - missing or invalid access_token
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "403":
          description: Not the character player nor the campaign DM
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "404":
          description: Campaign or character not found
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httperrors.HttpError'
      security:
      - BearerAuth: []
      summary: Remove character from campaign
      tags:
      - v1:character
  /core/api/v1/campaign/{campaignID}/status:
    patch:
      consumes:
      - application/json
      description: |-
        Updates campaign status to the following rules:
        - **DRAFT** -> ACTIVE
        - **ACTIVE** -> PAUSED / ARCHIVED
        - **PAUSED** -> ACTIVE / ARCHIVED
      parameters:
      - description: Campaign ID
        in: path
        name: campaignID
        required: true
        type: integer
      - description: New campaign status
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/campaign.UpdateCampaignStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/campaign.CampaignStatusResponse'
        "401":
          description: Unauthorized - missing or invalid access_token
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "403":
          description: Only the DM can update a campaign, or the status transition
            is invalid
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "404":
          description: Campaign not found
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httperrors.HttpError'
      security:
      - BearerAuth: []
      summary: Update Status
      tags:
      - v1:campaign
  /core/api/v1/campaign/{campaignID}/table-name:
    patch:
      consumes:
      - application/json
      description: 'Changes how the requester is called in this campaign: the DM name
        for the DM, otherwise the player name of their character in it'
      parameters:
      - description: Campaign ID
        in: path
        name: campaignID
        required: true
        type: integer
      - description: New table name
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/campaign.UpdateTableNameRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/campaign.TableNameResponse'
        "400":
          description: name missing or longer than 50 characters
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "401":
          description: Unauthorized - missing or invalid access_token
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "403":
          description: Not the DM nor a player in this campaign
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "404":
          description: Campaign not found
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httperrors.HttpError'
      security:
      - BearerAuth: []
      summary: Update my table name
      tags:
      - v1:campaign
  /core/api/v1/campaign/counts:
    get:
      description: Number of the current user campaigns in each status. Every status
        is present, with 0 when there is none
      parameters:
      - description: Only campaigns where the user has this role
        enum:
        - dm
        - player
        in: query
        name: role
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/campaign.CampaignStatusCountsResponse'
        "400":
          description: Invalid role
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "401":
          description: Unauthorized - missing or invalid access_token
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httperrors.HttpError'
      security:
      - BearerAuth: []
      summary: Get current user campaign counts by status
      tags:
      - v1:campaign
  /core/api/v1/campaign/resolve/{slug}:
    get:
      description: Resolves the campaign slug to the internal ID
      parameters:
      - description: Campaign slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rpg.RpgIdResponse'
        "400":
          description: Invalid slug
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "401":
          description: Unauthorized - missing or invalid access_token
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "404":
          description: Campaign not found
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httperrors.HttpError'
      security:
      - BearerAuth: []
      summary: Resolve campaign slug
      tags:
      - v1:campaign
  /core/api/v1/character:
    get:
      description: 'Get a page of the current user characters, ordered by `sort` (default:
        name, ignoring case and accents, then id)'
      parameters:
      - description: Only characters of this game system
        in: query
        name: game_system
        type: string
      - description: 'true: only characters without a campaign; false: only characters
          in a campaign'
        in: query
        name: without_campaign
        type: boolean
      - description: Only characters whose name contains it, ignoring case and accents
          (at most 100 characters)
        in: query
        name: q
        type: string
      - default: name
        description: 'name: by name; recent: last opened by the user first, never
          opened after, by name'
        enum:
        - name
        - recent
        in: query
        name: sort
        type: string
      - default: 50
        description: Page size, 1 to 100
        in: query
        name: limit
        type: integer
      - default: 0
        description: Number of characters to skip
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/character.CharacterListPageResponse'
        "400":
          description: Invalid game_system, q, sort, limit or offset
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "401":
          description: Unauthorized - missing or invalid access_token
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httperrors.HttpError'
      security:
      - BearerAuth: []
      summary: Get current user characters
      tags:
      - v1:character
    post:
      consumes:
      - application/json
      description: Create new character
      parameters:
      - description: Character data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/character.CreateCharacterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/rpg.RpgSlugResponse'
        "400":
          description: Invalid character data
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "401":
          description: Unauthorized - missing or invalid access_token
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httperrors.HttpError'
      security:
      - BearerAuth: []
      summary: Create character
      tags:
      - v1:character
  /core/api/v1/character/{characterID}:
    delete:
      description: Deletes a character
      parameters:
      - description: Character ID
        in: path
        name: characterID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized - missing or invalid access_token
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "403":
          description: Only the player can delete a character, or the campaign DM
            an unclaimed premade one
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "404":
          description: Character not found
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httperrors.HttpError'
      security:
      - BearerAuth: []
      summary: Delete character
      tags:
      - v1:character
    get:
      description: Get a more detailed view of the character. Visible to its player
        and, when the character is in a campaign, to the campaign DM and members
      parameters:
      - description: Character ID
        in: path
        name: characterID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/character.CharacterDetailResponse'
        "401":
          description: Unauthorized - missing or invalid access_token
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "403":
          description: Not the player nor a member of the character campaign
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "404":
          description: Character not found
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httperrors.HttpError'
      security:
      - BearerAuth: []
      summary: Get character details
      tags:
      - v1:character
    patch:
      consumes:
      - application/json
      description: Renames the character, for its player or the DM of its campaign.
        A new name regenerates the slug
      parameters:
      - description: Character ID
        in: path
        name: characterID
        required: true
        type: integer
      - description: Fields to change
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/character.EditCharacterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/character.CharacterEditResponse'
        "400":
          description: Missing or invalid name
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "401":
          description: Unauthorized - missing or invalid access_token
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "403":
          description: Not the character player nor its campaign DM
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "404":
          description: Character not found
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httperrors.HttpError'
      security:
      - BearerAuth: []
      summary: Edit character
      tags:
      - v1:character
  /core/api/v1/character/resolve/{slug}:
    get:
      description: Resolves the character slug to the internal ID
      parameters:
      - description: Character slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rpg.RpgIdResponse'
        "400":
          description: Invalid slug
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "401":
          description: Unauthorized - missing or invalid access_token
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "404":
          description: Character not found
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httperrors.HttpError'
      security:
      - BearerAuth: []
      summary: Resolve character slug
      tags:
      - v1:character
  /core/api/v1/invite:
    post:
      consumes:
      - application/json
      description: Create a new campaign invite
      parameters:
      - description: Invite data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/invite.CreateInviteRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/invite.InviteCreateResponse'
        "400":
          description: Campaign is archived
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "401":
          description: Unauthorized - missing or invalid access_token
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "403":
          description: Only the DM can create a campaign invite
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "404":
          description: Campaign not found
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "409":
          description: Invite for campaign already exists
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httperrors.HttpError'
      security:
      - BearerAuth: []
      summary: Create campaign invite
      tags:
      - v1:invite
  /core/api/v1/invite/{inviteHash}:
    get:
      description: Gets the invite's campaign details (name, overview, game system,
        player count) for any user holding the hash. `is_dm` tells whether the requester
        is the campaign DM, who can't accept the invite
      parameters:
      - description: Invite hash
        in: path
        name: inviteHash
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/invite.InviteDetailsResponse'
        "401":
          description: Unauthorized - missing or invalid access_token
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "404":
          description: Invite not found
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httperrors.HttpError'
      security:
      - BearerAuth: []
      summary: Get campaign invite details
      tags:
      - v1:invite
  /core/api/v1/invite/{inviteHash}/accept:
    post:
      consumes:
      - application/json
      description: Accepts campaign invite linking selected character to campaign
      parameters:
      - description: Invite accept data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/invite.AcceptInviteRequest'
      - description: Invite hash
        in: path
        name: inviteHash
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Campaign is archived, or the character is not the requester's,
            is already in a campaign or has another game system
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "401":
          description: Unauthorized - missing or invalid access_token
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "403":
          description: The DM can't join their own campaign
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "404":
          description: Invite not found
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httperrors.HttpError'
      security:
      - BearerAuth: []
      summary: Accept invite
      tags:
      - v1:invite
  /core/api/v1/user:
    get:
      description: Get current user profile
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.UserResponse'
        "401":
          description: Unauthorized - missing or invalid access_token
          schema:
            $ref: '#/definitions/httperrors.HttpError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httperrors.HttpError'
      security:
      - BearerAuth: []
      summary: Get current user profile
      tags:
      - v1:user
  /health:
    get:
      description: Check application health status
      responses:
        "200":
          description: OK
      summary: Health check
      tags:
      - health
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"

<!doctype html>
<!-- Swagger UI published to GitHub Pages by .github/workflows/pages.yml, which puts swagger.json next to this file -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Questmaster Core API</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.33.0/swagger-ui.css"
        integrity="sha384-Ov4/wv3j2bmct8cDc5X4ngJZohVPzEmc6uDPH8WeljUxO5vtoykvMEfbu9Vh6RaW"
        crossorigin="anonymous">
  <style>
    body { margin: 0; background: #fff; }
  </style>
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.33.0/swagger-ui-bundle.js"
          integrity="sha384-YDALVcy8kj8yltLBVi1vBiBAUqdxvus673gM8XKwiy6aDUJFXivF/KCufekjYbVf"
          crossorigin="anonymous"></script>
  <script>
    window.ui = SwaggerUIBundle({
      url: "swagger.json",
      dom_id: "#swagger-ui",
      deepLinking: true,
      // Documentation only: every endpoint needs a Keycloak token, so "Try it out" is disabled
      supportedSubmitMethods: [],
    });
  </script>
</body>
</html>
